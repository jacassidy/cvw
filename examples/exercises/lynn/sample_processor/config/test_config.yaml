name: lynn-rv32I
# Free GNU toolchain + prebuilt Sail reference model. Names are resolved on
# PATH by the act framework; the Lynn act4 flow puts $RISCV/bin (GCC >= 15) and
# the vendored sail binary on PATH. Override with absolute paths if desired.
compiler_exe: riscv64-unknown-elf-gcc
objdump_exe: riscv64-unknown-elf-objdump
ref_model_exe: sail_riscv_sim
ref_model_type: sail # sail or spike
udb_config: lynn-rv32I.yaml
linker_script: link.ld
dut_include_dir: . # Directory containing DUT specific rvmodel_macros.h header
include_priv_tests: False
